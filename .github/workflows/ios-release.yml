name: build and release

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ios-release-development
  cancel-in-progress: true

jobs:
  build-and-release:
    runs-on: macos-latest

    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: build Asteroid
        run: |
          set -euo pipefail
          xcodebuild \
            -project Asteroid.xcodeproj \
            -scheme Asteroid \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

          rm -rf Payload Asteroid.ipa
          mkdir -p Payload

          APP_PATH="$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -print -quit)"
          cp -R "$APP_PATH" Payload/

          ditto -c -k --keepParent Payload Asteroid.ipa
          rm -rf Payload

      - name: build ShineMobile web wrapper
        working-directory: ios/ShineMobile
        run: |
          set -euo pipefail
          rm -rf DerivedData Payload ShineMobile.ipa
          xcodebuild \
            -project ShineMobile.xcodeproj \
            -target ShineMobile \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath DerivedData \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=NO \
            build

          APP_PATH="$(find DerivedData/Build/Products/Release-iphoneos -maxdepth 1 -type d -name 'ShineMobile.app' -print -quit)"
          test -n "$APP_PATH"
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          ditto -c -k --keepParent Payload ShineMobile.ipa
          rm -rf Payload

      - name: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if gh release view development >/dev/null 2>&1; then
            gh release delete development --yes --cleanup-tag
          fi

          NOTES="$(git log -5 --pretty=format:'- %h %s')"

          gh release create development Asteroid.ipa ios/ShineMobile/ShineMobile.ipa \
            --target "${GITHUB_SHA}" \
            --title "Development" \
            --prerelease \
            --notes "automated build from ${GITHUB_SHA}

          ${NOTES}"